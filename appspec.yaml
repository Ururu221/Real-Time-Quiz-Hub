name: real-time-quiz-hub
version: 1.0.3

environment:
  # Has a default but can be overridden per environment.
  external:
    - Logging__LogLevel__Default=Information
  # Fixed for every environment.
  internal:
    - ASPNETCORE_ENVIRONMENT=Production
    - ASPNETCORE_HTTP_PORTS=8080

secrets:
  # PostgreSQL password. Used by the postgres infra service (infra.yaml) and by
  # the app, which reads it from the mounted file and fills the {postgres_password}
  # placeholder in the connection string (see Program.cs). Declared here only —
  # the value comes from the deployment environment, never from git.
  postgres_password:
  jwt_secret:

app_services:
  app:
    type: public
    # Prefix `plaingood` is mapped to ghcr.io/plaingoodtech by the release workflow
    # (-r plaingood="ghcr.io/plaingoodtech"). simpled appends the version as the tag.
    image: plaingood/quiz-hub-app
    environment:
      - $all
      # Postgres runs as an infra extra_service (see infra.yaml), reachable on the
      # deploy network at host `postgres`. The {postgres_password} placeholder is
      # NOT substituted by simpled in app-service env vars — the app fills it at
      # startup from the mounted secret file (see Program.cs). Kept here (service
      # env) rather than the top-level `internal:` section, which rejects values
      # containing `=`/`;`.
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=quizhub;Username=quizhub_user;Password={postgres_password}
    secrets:
      # Mounted as a file at /secrets/postgres_password; the app reads it to
      # replace the {postgres_password} placeholder in the connection string.
      - postgres_password:
          path: /secrets/postgres_password
      - jwt_secret:
          variable: JwtSettings__Secret
    ports:
      - "8080:8080"
