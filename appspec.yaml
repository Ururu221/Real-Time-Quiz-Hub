name: real-time-quiz-hub
version: 1.0.0

environment:
  # Has a default but can be overridden per environment.
  external:
    - Logging__LogLevel__Default=Information
  # Fixed for every environment.
  internal:
    - ASPNETCORE_ENVIRONMENT=Production
    - ASPNETCORE_HTTP_PORTS=8080
    # Postgres now runs as an infra extra_service (see infra.yaml), reachable on
    # the deploy network at host `postgres`. simpled replaces {postgres_password}
    # with the postgres_password secret value at deploy time.
    - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=quizhub;Username=quizhub_user;Password={postgres_password}

secrets:
  # PostgreSQL password. simpled substitutes it into the connection string above
  # and into the postgres infra service (infra.yaml). Declared here only — the
  # value comes from the deployment environment, never from git.
  postgres_password:
  jwt_secret:

app_services:
  app:
    type: public
    # Prefix `plaingood` is mapped to ghcr.io/plaingoodtech by the release workflow
    # (-r plaingood="ghcr.io/plaingoodtech"). simpled appends the version as the tag.
    image: plaingood/quiz-hub-app
    environment:
      - $all
    secrets:
      # Attached so simpled resolves the {postgres_password} placeholder used in
      # the ConnectionStrings__DefaultConnection environment variable above.
      - postgres_password:
      - jwt_secret:
          variable: JwtSettings__Secret
    ports:
      - "8080:8080"
